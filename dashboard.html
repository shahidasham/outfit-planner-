<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Outfit Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ================= BASE ================= */
body{
margin:0;
background:linear-gradient(135deg,#0a0a0a,#111,#1a1a1a);
color:white;
font-family:Poppins,sans-serif;
}

/* ================= MOBILE APP NAVBAR ================= */
.navbar{
position:sticky;
top:0;
z-index:999;
background:rgba(10,10,10,0.9)!important;
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);
}

/* brand */
.navbar-brand{
font-weight:800;
letter-spacing:1px;
}

/* links spacing for mobile */
.navbar-nav .nav-link{
margin-left:10px;
font-size:14px;
}

/* ================= TITLE ================= */
.dashboard-title{
font-size:22px;
font-weight:800;
letter-spacing:1px;
margin-top:20px;
}

.sub{
color:#aaa;
margin-bottom:20px;
font-size:13px;
}

/* ================= CARD (APP STYLE) ================= */
.card{
background:#1b1b1b;
border:none;
border-radius:18px;
padding:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
transition:0.3s;
height:100%;
}

.card:hover{
transform:translateY(-5px);
}

h5{
font-size:14px;
font-weight:700;
color:#fff;
}

/* charts */
canvas{
margin-top:10px;
width:100%!important;
height:auto!important;
}

/* ================= GRID FIX ================= */
.row{
margin-top:10px;
}

/* mobile spacing */
@media(max-width:768px){

.dashboard-title{
font-size:18px;
text-align:center;
}

.sub{
text-align:center;
}

.navbar-nav{
flex-direction:row;
flex-wrap:wrap;
justify-content:center;
}

.card{
padding:12px;
}

}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand">👗 Outfit Planner</a>

<div class="navbar-nav ms-auto d-flex flex-row">
<a class="nav-link active" href="dashboard.html">Dashboard</a>
<a class="nav-link" href="outfits.html">Outfits</a>
<a class="nav-link" href="planner.html">Planner</a>
<a class="nav-link text-warning" href="index.html">Logout</a>
</div>

</div>
</nav>

<!-- CONTENT -->
<div class="container py-3">

<h2 class="dashboard-title">OUTFIT ANALYTICS</h2>
<p class="sub">Live planner performance dashboard</p>

<div class="row g-3">

<div class="col-12 col-md-6">
<div class="card">
<h5>Outfit Categories</h5>
<canvas id="c1"></canvas>
</div>
</div>

<div class="col-12 col-md-6">
<div class="card">
<h5>Planner Completion</h5>
<canvas id="c2"></canvas>
</div>
</div>

<div class="col-12 col-md-6">
<div class="card">
<h5>Favourite Style</h5>
<canvas id="c3"></canvas>
</div>
</div>

<div class="col-12 col-md-6">
<div class="card">
<h5>Weekly Activity</h5>
<canvas id="c4"></canvas>
</div>
</div>

<div class="col-12 col-md-6">
<div class="card">
<h5>Selection Frequency</h5>
<canvas id="c5"></canvas>
</div>
</div>

<div class="col-12 col-md-6">
<div class="card">
<h5>Completed vs Empty</h5>
<canvas id="c6"></canvas>
</div>
</div>

</div>
</div>

<script>

/* Chart style */
Chart.defaults.color = "#ffffff";
Chart.defaults.borderColor = "rgba(255,255,255,0.15)";

/* DATA */
let planner = JSON.parse(localStorage.getItem("planner")) || {};
let days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

let cat = {formal:0, casual:0, sport:0, party:0};
let completed = 0;

days.forEach(day=>{
let item = planner[day];

if(item){
completed++;

let name = item.name.toLowerCase();

if(name.includes("suit")) cat.formal++;
else if(name.includes("casual")) cat.casual++;
else if(name.includes("sport")) cat.sport++;
else if(name.includes("party")) cat.party++;
}
});

/* CHART 1 */
new Chart(document.getElementById("c1"),{
type:"bar",
data:{
labels:["Formal","Casual","Sport","Party"],
datasets:[{
data:[cat.formal,cat.casual,cat.sport,cat.party],
backgroundColor:["#6c63ff","#00d4ff","#00c896","#ff6b6b"]
}]
}
});

/* CHART 2 */
new Chart(document.getElementById("c2"),{
type:"line",
data:{
labels:days,
datasets:[{
data:days.map(d=> planner[d] ? 1 : 0),
borderColor:"#00d4ff",
tension:0.3
}]
}
});

/* CHART 3 */
new Chart(document.getElementById("c3"),{
type:"pie",
data:{
labels:["Formal","Casual","Sport","Party"],
datasets:[{
data:[cat.formal,cat.casual,cat.sport,cat.party],
backgroundColor:["#6c63ff","#00d4ff","#00c896","#ff6b6b"]
}]
}
});

/* CHART 4 */
new Chart(document.getElementById("c4"),{
type:"bar",
data:{
labels:days,
datasets:[{
data:days.map(d=> planner[d] ? 1 : 0),
backgroundColor:"#00c896"
}]
}
});

/* CHART 5 */
new Chart(document.getElementById("c5"),{
type:"line",
data:{
labels:days,
datasets:[{
data:days.map(d=> planner[d] ? 1 : 0),
borderColor:"#ffd93d",
tension:0.3
}]
}
});

/* CHART 6 */
new Chart(document.getElementById("c6"),{
type:"pie",
data:{
labels:["Completed","Empty"],
datasets:[{
data:[completed, 5-completed],
backgroundColor:["#00c896","#ff6b6b"]
}]
}
});

</script>

</body>
</html>
