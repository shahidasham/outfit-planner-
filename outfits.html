<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Outfit Planner System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ================= BASE ================= */
body{
background:linear-gradient(135deg,#0a0a0a,#111,#1a1a1a);
color:white;
font-family:Poppins,sans-serif;
margin:0;
}

/* NAVBAR */
.navbar{
background:#111!important;
border-bottom:1px solid rgba(255,255,255,0.08);
}

/* FILTER BOX */
.filter-box{
background:#1b1b1b;
padding:20px;
border-radius:20px;
margin-bottom:25px;
}

/* INPUT */
.form-control,.form-select{
background:#222;
border:none;
color:white;
}

.form-control:focus,.form-select:focus{
background:#222;
color:white;
box-shadow:none;
}

/* GRID */
#outfitList{
display:flex;
flex-wrap:wrap;
gap:20px;
}

/* CARD */
.outfit-item{
flex: 1 1 calc(25% - 20px);
min-width:250px;
}

/* CARD STYLE */
.outfit-card{
background:#1b1b1b;
border:none;
border-radius:18px;
overflow:hidden;
transition:0.3s;
height:100%;
position:relative;
}

.outfit-card:hover{
transform:translateY(-10px);
}

/* IMAGE */
.outfit-card img{
width:100%;
height:420px;
object-fit:cover;
object-position:top;
display:block;
}

/* BADGE */
.badge-formal{background:#6c63ff;}
.badge-casual{background:#00d4ff;color:black;}
.badge-sport{background:#00c896;}
.badge-party{background:#ff6b6b;}

/* BUTTON */
.btn-select{
background:white;
color:black;
font-weight:600;
border:none;
}

.btn-select:hover{
background:#ddd;
}

/* FAVORITE */
.fav-btn{
position:absolute;
top:10px;
right:10px;
background:black;
border:none;
color:white;
width:35px;
height:35px;
border-radius:50%;
cursor:pointer;
}

.fav-btn.active{
color:red;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
right:20px;
background:#00c896;
color:black;
padding:12px 18px;
border-radius:10px;
display:none;
z-index:999;
}

/* MODAL */
.modal-dialog{
max-width:1000px;
}

.modal-content{
background:#1b1b1b;
color:white;
border-radius:15px;
padding:15px;
}

.outfit-option{
background:#222;
padding:10px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.outfit-option:hover{
transform:scale(1.03);
background:#333;
}

.outfit-option img{
width:100%;
height:420px;
object-fit:cover;
border-radius:12px;
margin-bottom:10px;
}

/* ================= MOBILE APP RESPONSIVE (ADDED ONLY) ================= */

@media (max-width: 768px){

.container{
padding-left:15px;
padding-right:15px;
}

h2{
font-size:18px;
text-align:center;
}

.text-secondary{
text-align:center;
font-size:13px;
}

/* filter padding smaller */
.filter-box{
padding:15px;
border-radius:16px;
}

/* cards full width */
.outfit-item{
flex:1 1 100% !important;
min-width:100% !important;
}

/* smaller images */
.outfit-card img{
height:260px;
}

/* better touch button */
.btn-select{
padding:12px;
font-size:14px;
}

/* navbar mobile style */
.navbar-nav{
flex-direction:row;
justify-content:space-around;
width:100%;
}

.navbar .nav-link{
font-size:13px;
padding:6px 8px;
}

/* toast center */
#toast{
left:50%;
right:auto;
transform:translateX(-50%);
bottom:15px;
font-size:13px;
}

/* modal mobile fix */
.modal-dialog{
margin:10px;
}

.outfit-option img{
height:220px;
}

}

/* small phone */
@media (max-width: 400px){

h2{
font-size:16px;
}

.outfit-card img{
height:220px;
}

.btn-select{
font-size:13px;
}

}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand fw-bold">
👗 Outfit Planner
</a>

<div class="navbar-nav ms-auto">
<a class="nav-link" href="dashboard.html">Dashboard</a>
<a class="nav-link" href="outfits.html">Outfits</a>
<a class="nav-link active" href="planner.html">Planner</a>
<a class="nav-link text-warning" href="index.html">Logout</a>
</div>

</div>
</nav>

<div class="container py-5">

<h2>Outfit Collection</h2>
<p class="text-secondary">Search, filter and choose your outfit</p>

<div class="alert alert-success text-dark" id="selectedBox">
No outfit selected
</div>

<!-- FILTER -->
<div class="filter-box">

<div class="row">

<div class="col-md-6 mb-2">
<input type="text" id="searchInput" class="form-control"
placeholder="Search outfit..." onkeyup="searchOutfit()">
</div>

<div class="col-md-6 mb-2">
<select id="categoryFilter" class="form-select" onchange="filterAll()">
<option value="all">All Categories</option>
<option value="formal">Formal</option>
<option value="casual">Casual</option>
<option value="sport">Sport</option>
<option value="party">Party</option>
</select>
</div>

</div>

</div>

<!-- OUTFITS -->
<div id="outfitList">

<div class="outfit-item" data-category="formal">
<div class="card outfit-card">
<button class="fav-btn" onclick="addFav(this,'Formal Suit')">❤</button>
<img src="formal 1.jpg">
<div class="card-body">
<h5>Formal Suit</h5>
<span class="badge badge-formal">Formal</span>
<button class="btn btn-select w-100 mt-2" onclick="openOutfit('formal')">Choose Outfit</button>
</div>
</div>
</div>

<div class="outfit-item" data-category="casual">
<div class="card outfit-card">
<button class="fav-btn" onclick="addFav(this,'Casual Wear')">❤</button>
<img src="casual1.webp">
<div class="card-body">
<h5>Casual Wear</h5>
<span class="badge badge-casual">Casual</span>
<button class="btn btn-select w-100 mt-2" onclick="openOutfit('casual')">Choose Outfit</button>
</div>
</div>
</div>

<div class="outfit-item" data-category="sport">
<div class="card outfit-card">
<button class="fav-btn" onclick="addFav(this,'Sport Outfit')">❤</button>
<img src="sport1.avif">
<div class="card-body">
<h5>Sport Outfit</h5>
<span class="badge badge-sport">Sport</span>
<button class="btn btn-select w-100 mt-2" onclick="openOutfit('sport')">Choose Outfit</button>
</div>
</div>
</div>

<div class="outfit-item" data-category="party">
<div class="card outfit-card">
<button class="fav-btn" onclick="addFav(this,'Party Outfit')">❤</button>
<img src="party1.jpg">
<div class="card-body">
<h5>Party Outfit</h5>
<span class="badge badge-party">Party</span>
<button class="btn btn-select w-100 mt-2" onclick="openOutfit('party')">Choose Outfit</button>
</div>
</div>
</div>

</div>

</div>

<!-- MODAL -->
<div class="modal fade" id="outfitModal">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content">

<h5 id="modalTitle" class="mb-3"></h5>
<div id="outfitOptions" class="d-grid gap-3"></div>

</div>
</div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>

/* SEARCH */
function searchOutfit(){
let input = document.getElementById("searchInput").value.toLowerCase();
document.querySelectorAll(".outfit-item").forEach(item=>{
item.style.display = item.innerText.toLowerCase().includes(input) ? "block":"none";
});
}

/* FILTER */
function filterAll(){
let c = document.getElementById("categoryFilter").value;

document.querySelectorAll(".outfit-item").forEach(item=>{
item.style.display = (c==="all"||item.dataset.category===c) ? "block":"none";
});
}

/* MODAL */
function openOutfit(type){

const data = {
formal:[
{img:"formal 1.jpg", name:"Men Suit"},
{img:"formal 2.webp", name:"Women Suit"}
],
casual:[
{img:"casual1.webp", name:"Casual Men"},
{img:"casual2.jpg", name:"Casual Women"}
],
sport:[
{img:"sport1.avif", name:"Sport Men"},
{img:"sport2.avif", name:"Sport Women"}
],
party:[
{img:"party1.jpg", name:"Party Men"},
{img:"party2.jpg", name:"Party Women"}
]
};

let box = document.getElementById("outfitOptions");
let title = document.getElementById("modalTitle");

box.innerHTML = "";

data[type].forEach(item=>{
box.innerHTML += `
<div class="outfit-option" onclick="selectOutfit('${item.name}')">
<img src="${item.img}">
<div style="text-align:center;font-weight:600;">
${item.name}
</div>
</div>`;
});

title.innerText = type.toUpperCase() + " OUTFITS";

new bootstrap.Modal(document.getElementById("outfitModal")).show();
}

/* SELECT */
function selectOutfit(name){
document.getElementById("selectedBox").innerHTML =
"✅ Selected Outfit: " + name;
}

/* FAVORITE */
function addFav(btn,name){
btn.classList.toggle("active");
showToast("❤️ Added: " + name);
}

/* TOAST */
function showToast(msg){
let toast = document.getElementById("toast");
toast.innerText = msg;
toast.style.display = "block";

setTimeout(()=>{toast.style.display="none"},2000);
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
