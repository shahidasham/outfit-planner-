<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Outfit Planner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ================= BASE ================= */
body{
background:linear-gradient(135deg,#0a0a0a,#111,#1a1a1a);
color:white;
font-family:Poppins,sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
margin:0;
}

/* NAVBAR */
.navbar{
background:#111!important;
border-bottom:1px solid rgba(255,255,255,0.08);
}

/* BOX */
.box{
background:#1b1b1b;
padding:20px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.05);
}

/* CALENDAR */
.calendar{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:15px;
}

/* DAY CARD */
.day-card{
background:#151515;
border-radius:15px;
padding:12px;
cursor:pointer;
border:1px solid rgba(255,255,255,0.05);
transition:0.3s;
}

.day-card:hover{
transform:translateY(-5px);
}

.day-title{
font-weight:600;
margin-bottom:8px;
}

.day-card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.day-name{
font-size:13px;
color:#ccc;
margin-top:8px;
}

.empty{
border:2px dashed #444;
}

.completed{
border:2px solid #00c896;
}

/* STATS */
.stats-card{
background:#1b1b1b;
padding:20px;
border-radius:20px;
text-align:center;
height:100%;
}

.stats-card h3{
font-size:32px;
margin:10px 0;
}

/* PROGRESS */
.progress{
height:12px;
background:#222;
}

.progress-bar{
background:#00c896;
}

/* FOOTER */
footer{
margin-top:auto;
background:#111;
text-align:center;
padding:15px;
border-top:1px solid rgba(255,255,255,0.08);
}

/* MODAL */
.modal-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.modal-box{
background:#111;
padding:20px;
border-radius:20px;
width:90%;
max-width:900px;
max-height:90vh;
overflow-y:auto;
}

.outfit-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:15px;
}

.outfit-item{
background:#222;
padding:10px;
border-radius:15px;
cursor:pointer;
transition:.3s;
}

.outfit-item:hover{
transform:scale(1.03);
background:#333;
}

.outfit-item img{
width:100%;
height:260px;
object-fit:cover;
border-radius:12px;
}

/* BUTTON */
.btn-custom{
border:none;
padding:10px;
border-radius:10px;
font-weight:600;
}

.btn-random{
background:#0d6efd;
color:white;
}

.btn-clear{
background:#dc3545;
color:white;
}

.today-box{
background:#1b1b1b;
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

/* ================= MOBILE RESPONSIVE (ADDED ONLY) ================= */

@media (max-width: 768px){

.container{
padding-left:15px;
padding-right:15px;
}

.today-box{
text-align:center;
font-size:14px;
}

.calendar{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.day-card img{
height:140px;
}

.stats-card{
padding:15px;
border-radius:16px;
}

.stats-card h3{
font-size:24px;
}

.modal-box{
width:95%;
padding:15px;
border-radius:16px;
}

.outfit-grid{
grid-template-columns:1fr;
}

.btn-custom{
padding:12px;
font-size:14px;
}

footer{
font-size:13px;
padding:12px;
}

}

/* SMALL PHONE */
@media (max-width: 400px){

.calendar{
grid-template-columns:1fr;
}

.day-card img{
height:120px;
}

.stats-card h3{
font-size:20px;
}

}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand fw-bold">
👗 Outfit Planner 
</a>

<div class="navbar-nav ms-auto">
<a class="nav-link" href="dashboard.html">Dashboard</a>
<a class="nav-link" href="outfits.html">Outfits</a>
<a class="nav-link active" href="planner.html">Planner</a>
<a class="nav-link text-warning" href="index.html">Logout</a>
</div>

</div>
</nav>

<div class="container py-5">

<!-- TODAY -->
<div class="today-box">

<h5>📅 Today's Date</h5>
<div id="todayDate"></div>

</div>

<!-- STATS -->
<div class="row mb-4">

<div class="col-md-3 mb-3">
<div class="stats-card">
<h6>Total Planned</h6>
<h3 id="totalPlanned">0</h3>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="stats-card">
<h6>Favourite Style</h6>
<h3 id="favStyle">-</h3>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="stats-card">
<h6>Progress</h6>
<h3 id="progressText">0%</h3>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="stats-card">

<button class="btn-custom btn-random w-100 mb-2" onclick="randomWeek()">
🎲 Random Week
</button>

<button class="btn-custom btn-clear w-100" onclick="clearPlanner()">
🗑 Clear Planner
</button>

</div>
</div>

</div>

<!-- PROGRESS -->
<div class="box mb-4">
<div class="progress">
<div class="progress-bar" id="progressBar" style="width:0%"></div>
</div>
</div>

<!-- CALENDAR -->
<div class="box">
<h3 class="mb-3">Weekly Planner</h3>
<div class="calendar" id="calendar"></div>
</div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modal">

<div class="modal-box">

<h4 id="modalTitle">Choose Outfit</h4>

<div class="outfit-grid" id="outfitList"></div>

<br>

<button class="btn btn-secondary w-100" onclick="closeModal()">
Close
</button>

</div>

</div>

<footer>
© 2026 Outfit Planner System
</footer>

<script>

/* DATE */
document.getElementById("todayDate").innerHTML =
new Date().toDateString();

/* DATA */
let selectedDay="";

let data = JSON.parse(localStorage.getItem("planner")) || {
Monday:null,
Tuesday:null,
Wednesday:null,
Thursday:null,
Friday:null
};

/* OUTFITS */
const outfits = {
formal:[
{img:"formal 1.jpg",name:"Men Suit"},
{img:"formal 2.webp",name:"Women Suit"}
],
casual:[
{img:"casual1.webp",name:"Casual Men"},
{img:"casual2.jpg",name:"Casual Women"}
],
sport:[
{img:"sport1.avif",name:"Sport Men"},
{img:"sport2.avif",name:"Sport Women"}
],
party:[
{img:"party1.jpg",name:"Party Men"},
{img:"party2.jpg",name:"Party Women"}
]
};

/* RENDER */
function render(){

let html="";
let total=0;

for(let day in data){

let item=data[day];

if(item){
total++;

html+=`
<div class="day-card completed" onclick="openModal('${day}')">
<div class="day-title">${day}</div>
<img src="${item.img}">
<div class="day-name">${item.name}</div>
</div>`;
}else{
html+=`
<div class="day-card empty" onclick="openModal('${day}')">
<div class="day-title">${day}</div>
<img src="https://via.placeholder.com/300x180?text=No+Outfit">
<div class="day-name">No Outfit Selected</div>
</div>`;
}
}

document.getElementById("calendar").innerHTML=html;
updateStats(total);
}

/* STATS */
function updateStats(total){

document.getElementById("totalPlanned").innerHTML=total;

let percent=(total/5)*100;
document.getElementById("progressBar").style.width=percent+"%";
document.getElementById("progressText").innerHTML=percent+"%";

let styles={formal:0,casual:0,sport:0,party:0};

for(let d in data){
if(data[d]){
let name=data[d].name;
if(name.includes("Suit"))styles.formal++;
else if(name.includes("Casual"))styles.casual++;
else if(name.includes("Sport"))styles.sport++;
else if(name.includes("Party"))styles.party++;
}
}

let fav="-",max=0;

for(let s in styles){
if(styles[s]>max){
max=styles[s];
fav=s.toUpperCase();
}
}

document.getElementById("favStyle").innerHTML=fav;
}

/* MODAL */
function openModal(day){

selectedDay=day;

document.getElementById("modalTitle").innerHTML=
"Choose Outfit for "+day;

let html="";

Object.keys(outfits).forEach(type=>{
outfits[type].forEach(item=>{
html+=`
<div class="outfit-item" onclick="selectOutfit('${item.name}','${item.img}')">
<img src="${item.img}">
<h6 class="mt-2 text-center">${item.name}</h6>
</div>`;
});
});

document.getElementById("outfitList").innerHTML=html;
document.getElementById("modal").style.display="flex";
}

/* CLOSE */
function closeModal(){
document.getElementById("modal").style.display="none";
}

/* SELECT */
function selectOutfit(name,img){

data[selectedDay]={name,img};

localStorage.setItem("planner",JSON.stringify(data));

closeModal();
render();
}

/* RANDOM */
function randomWeek(){

let all=[];
Object.keys(outfits).forEach(t=>{
all.push(...outfits[t]);
});

for(let d in data){
data[d]=all[Math.floor(Math.random()*all.length)];
}

localStorage.setItem("planner",JSON.stringify(data));
render();
}

/* CLEAR */
function clearPlanner(){

if(confirm("Clear all planner?")){

data={
Monday:null,Tuesday:null,Wednesday:null,Thursday:null,Friday:null
};

localStorage.setItem("planner",JSON.stringify(data));
render();
}
}

render();

</script>

</body>
</html>
